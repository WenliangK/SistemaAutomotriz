<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestion - Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css?v=20260920b">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/redesign.css">
    <link rel="stylesheet" href="../css/polish.css?v=20261001">
    <script>
        (function(){var t=localStorage.getItem('ag-theme')||'system';if(t==='system')t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-bs-theme',t);})();
    </script>
</head>
<body>
    <div id="navbar"></div>
    <div class="ag-page">
        <div class="ag-page-header"><h1>Gestion de Inventario</h1><p>Control de repuestos e insumos del taller</p></div>
        <div id="alertContainer"></div>
        <div class="ag-layout-sidebar">
            <div class="ag-section">
                <div class="ag-section-header">                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                            Catalogo de Productos
                        </h3>
                    <div style="display:flex; gap:0.5rem; align-items:center;">
                        <div class="ag-search-box" style="width:200px;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="searchProducto" placeholder="Buscar producto..." oninput="filtrarProductos()">
                        </div>
                        <button class="ag-btn ag-btn-accent ag-btn-sm" id="btnNuevoProducto" onclick="abrirModal('modalNuevoProducto')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Nuevo Producto
                    </button>
                    </div>
                </div>
                <div class="ag-section-body" style="max-height:600px; overflow-y:auto;">
                    <div class="ag-table-wrap">
                        <table class="ag-table">
                            <thead><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th class="col-num">Precio</th><th class="col-num" style="min-width:130px;">Stock</th><th class="col-num">Minimo</th><th>Estado</th><th></th></tr></thead>
                            <tbody id="productosBody"><tr><td colspan="8" class="ag-text-center ag-text-muted">Cargando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="ag-layout-stack">
                <div class="ag-section" id="movimientoSection">
                    <div class="ag-section-header">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                            Entrada / Ajuste
                        </h3>
                    </div>
                    <div class="ag-section-body">
                        <form id="movimientoForm">
                            <div class="ag-form-group"><label class="ag-form-label">Producto *</label><select class="ag-form-control" id="movimientoProducto" required><option value="">-- Seleccionar --</option></select></div>
                            <div class="ag-form-group"><label class="ag-form-label">Tipo *</label><select class="ag-form-control" id="movimientoTipo" required><option value="ENTRADA">Entrada (Compra)</option><option value="AJUSTE">Ajuste de Inventario</option></select></div>
                            <div class="ag-form-group"><label class="ag-form-label">Cantidad *</label><div id="movimientoCantidadWrap"></div></div>
                            <div class="ag-form-group"><label class="ag-form-label">Motivo</label><input type="text" class="ag-form-control" id="movimientoMotivo" placeholder="Ej: Compra mensual..."></div>
                            <button type="submit" class="ag-btn ag-btn-success ag-btn-block">Registrar Movimiento</button>
                        </form>
                    </div>
                </div>
                <div class="ag-section">
                    <div class="ag-section-header">
                        <h3 style="color:var(--ag-signal-stop);">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                            Alertas de Stock
                        </h3>
                    </div>
                    <div class="ag-section-body" style="max-height:250px; overflow-y:auto;" id="alertasContainer">
                        <p class="ag-text-muted">Cargando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="ag-modal-overlay" id="modalNuevoProducto">            <div class="ag-card ag-modal">
            <div class="ag-card-header"><h3>Nuevo Producto</h3><button class="ag-btn ag-btn-outline ag-btn-sm" onclick="cerrarModal('modalNuevoProducto')" title="Cerrar (Esc)"><svg viewBox="0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
            <div class="ag-card-body">
                <form id="nuevoProductoForm">
                    <div class="ag-form-group"><label class="ag-form-label">Nombre *</label><input type="text" class="ag-form-control" id="productoNombre" required></div>
                    <div class="ag-form-group"><label class="ag-form-label">Tipo *</label><select class="ag-form-control" id="productoTipo" required><option value="REPUESTO">Repuesto</option><option value="INSUMO">Insumo</option></select></div>
                    <div class="ag-form-group"><label class="ag-form-label">Precio Unitario (S/) *</label><input type="number" class="ag-form-control" id="productoPrecio" step="0.01" required></div>
                    <div class="ag-grid ag-grid-2">
                        <div class="ag-form-group"><label class="ag-form-label">Stock Actual</label><input type="number" class="ag-form-control" id="productoStock" value="0" min="0"></div>
                        <div class="ag-form-group"><label class="ag-form-label">Stock Minimo</label><input type="number" class="ag-form-control" id="productoStockMin" value="0" min="0"></div>
                    </div>
                    <div class="ag-d-flex ag-gap-3 ag-mt-2">
                        <button type="button" class="ag-btn ag-btn-outline" onclick="cerrarModal('modalNuevoProducto')">Cancelar</button>
                        <button type="button" class="ag-btn ag-btn-primary" onclick="crearProducto()" style="flex:1;">Crear Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="themeToggleWrap"></div>
    <script src="../js/api.js?v=20260920b"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/ui-kit.js"></script>
    <script>
        if (!guardPage('inventario')) throw new Error('Acceso denegado');
        document.getElementById('navbar').innerHTML = renderNavbar('inventario');
        document.getElementById('themeToggleWrap').innerHTML = renderThemeToggle();
        initTheme();
        document.getElementById('movimientoCantidadWrap').innerHTML = agStepper('movimientoCantidad', { value: 1, min: 1 });
        document.getElementById('movimientoCantidad').setAttribute('required', '');
        /* Escritura de inventario reservada a Almacenero (y Admin) */
        const puedeEditarStock = ['ALMACENERO', 'ADMIN'].includes(getUser().rol);
        if (!puedeEditarStock) {
            document.getElementById('btnNuevoProducto').hidden = true;
            document.getElementById('movimientoSection').hidden = true;
        }
        function abrirModal(id) { document.getElementById(id).classList.add('show'); }
        function cerrarModal(id) { document.getElementById(id).classList.remove('show'); }
        /* Cerrar modales con clic fuera y tecla Esc */
        document.querySelectorAll('.ag-modal-overlay').forEach(ov => {
            ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('show'); });
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') document.querySelectorAll('.ag-modal-overlay.show').forEach(ov => ov.classList.remove('show'));
        });
        let productosCache = [];
        window.filtrarProductos = function() {
            const q = (document.getElementById('searchProducto').value || '').toLowerCase();
            renderProductos(productosCache.filter(p =>
                !q || p.nombre.toLowerCase().includes(q) || (p.tipo || '').toLowerCase().includes(q) || String(p.id) === q
            ));
        }
        function renderProductos(productos) {
            const tbody = document.getElementById('productosBody');
            if (!productos.length) {
                agEmptyState(tbody, '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/>', 'Sin resultados', 'Ningun producto coincide con la busqueda.');
                return;
            }
            tbody.innerHTML = productos.map(p => {
                const bajo = p.stockActual < p.stockMinimo;
                const pct = Math.min(100, p.stockMinimo > 0 ? Math.round((p.stockActual / (p.stockMinimo * 3)) * 100) : (p.stockActual > 0 ? 100 : 0));
                return `<tr class="${stockClass(p.stockActual, p.stockMinimo)}">
                    <td class="ag-text-muted" style="font-family:var(--ag-font-heading);">${p.id}</td><td class="ag-fw-600">${p.nombre}</td>
                    <td>${tipoBadge(p.tipo)}</td><td class="col-num">${formatCurrency(p.precioUnitario)}</td>
                    <td class="col-num">
                        <div class="ag-d-flex ag-align-center" style="gap:0.5rem; justify-content:flex-end;">
                            <div style="flex:1; max-width:70px; height:5px; background:var(--ag-border-subtle); border-radius:999px; overflow:hidden;">
                                <div style="height:100%; width:${pct}%; background:${bajo ? 'linear-gradient(90deg,#f87171,#dc2626)' : 'linear-gradient(90deg,#34d399,#059669)'}; border-radius:999px;"></div>
                            </div>
                            <span class="${bajo ? 'ag-fw-700' : ''}" style="${bajo ? 'color:var(--ag-signal-stop);' : ''}">${p.stockActual}</span>
                        </div>
                    </td>
                    <td class="col-num">${p.stockMinimo}</td>
                    <td>${bajo ? '<span class="ag-badge ag-badge-danger">Bajo</span>' : '<span class="ag-badge ag-badge-success">OK</span>'}</td>
                    <td>${puedeEditarStock ? `<button class="ag-btn ag-btn-outline ag-btn-sm" onclick="editarStock(${p.id},'${p.nombre.replace(/'/g,"\\'")}',${p.stockActual})" title="Ajustar stock" style="padding:0.25rem 0.5rem;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>` : ''}</td></tr>`;
            }).join('');
        }
        async function loadProductos() {
            try {
                const productos = await apiFetch('/productos');
                productosCache = productos;
                const sel = document.getElementById('movimientoProducto'); sel.length = 1;
                renderProductos(productos);
                productos.forEach(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = `${p.nombre} (Stock: ${p.stockActual})`; sel.appendChild(o); });
                loadAlertas();
            } catch (e) { showError('alertContainer', 'Error: ' + e.message); }
        }
        async function loadAlertas() {
            try {
                const alertas = await apiFetch('/inventario/alertas');
                const c = document.getElementById('alertasContainer');
                if (!alertas.length) {
                    c.innerHTML = '<div class="ag-alert ag-alert-success" style="margin:0;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>Stock en niveles adecuados</span></div>';
                    return;
                }
                c.innerHTML = alertas.map(a => `
                    <div class="ag-state-card sc-cancelada" style="margin-bottom:0.5rem; padding:0.65rem 0.85rem;">
                        <div class="ag-d-flex ag-justify-between ag-align-center">
                            <div><strong style="font-size:0.85rem;">${a.nombre}</strong>
                            <div class="ag-text-sm ag-text-muted">Actual: ${a.stockActual} · Minimo: ${a.stockMinimo}</div></div>
                            <span class="ag-badge ag-badge-danger">Faltan ${a.stockMinimo - a.stockActual}</span>
                        </div>
                    </div>`).join('');
            } catch (e) { document.getElementById('alertasContainer').innerHTML = '<p class="ag-text-muted">Sin alertas</p>'; }
        }
        async function crearProducto() {
            try {
                await apiFetch('/productos', { method: 'POST', body: JSON.stringify({ nombre: document.getElementById('productoNombre').value, tipo: document.getElementById('productoTipo').value, precioUnitario: parseFloat(document.getElementById('productoPrecio').value), stockActual: parseInt(document.getElementById('productoStock').value), stockMinimo: parseInt(document.getElementById('productoStockMin').value) }) });
                cerrarModal('modalNuevoProducto'); showSuccess('alertContainer', 'Producto creado'); loadProductos();
            } catch (e) { showError('alertContainer', e.message); }
        }
        function editarStock(id, nombre, actual) {
            const nv = prompt(`Stock actual de "${nombre}": ${actual}\n\nIngrese nuevo stock:`);
            if (nv === null) return;
            const diff = parseInt(nv) - actual;
            if (diff === 0) return;
            registrarMovimiento(id, diff >= 0 ? 'ENTRADA' : 'AJUSTE', Math.abs(diff), 'Ajuste manual');
        }
        document.getElementById('movimientoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiFetch('/inventario/movimientos', { method: 'POST', body: JSON.stringify({ productoId: parseInt(document.getElementById('movimientoProducto').value), tipo: document.getElementById('movimientoTipo').value, cantidad: parseInt(document.getElementById('movimientoCantidad').value), motivo: document.getElementById('movimientoMotivo').value }) });
                showSuccess('alertContainer', 'Movimiento registrado'); document.getElementById('movimientoForm').reset(); loadProductos();
            } catch (e) { showError('alertContainer', e.message); }
        });
        async function registrarMovimiento(pid, tipo, cant, motivo) {
            try { await apiFetch('/inventario/movimientos', { method: 'POST', body: JSON.stringify({ productoId: pid, tipo, cantidad: cant, motivo }) }); showSuccess('alertContainer', 'Stock actualizado'); loadProductos(); } catch (e) { showError('alertContainer', e.message); }
        }
        loadProductos();
        agSkeleton(document.getElementById('productosBody'), 'table');
    </script>
</body>
</html>
