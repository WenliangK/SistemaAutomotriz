# PostgreSQL configuration for Docker environment
spring.datasource.url=jdbc:postgresql://db:5432/autogestion
spring.datasource.username=autogestion
spring.datasource.password=autogestion2024
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable H2 console
spring.h2.console.enabled=false

# Disable SQL init (tables are created by init.sql)
spring.sql.init.mode=never

# JWT
app.jwt.secret=autogestion-secret-key-muy-largo-para-hmac-sha256-2024
app.jwt.expiration-ms=86400000

server.port=8080