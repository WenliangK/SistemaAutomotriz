# ============================================================
# AutoGestion - Configuración de Spring Boot
# ============================================================

# Datasource - H2 en memoria (para presentaciones sin PostgreSQL)
spring.datasource.url=jdbc:h2:mem:autogestion;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para inspeccionar la BD en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# SQL init (carga el schema + datos semilla al iniciar)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
# Los datos semilla los inserta DataInitializer.java con BCrypt correcto

# JWT
app.jwt.secret=autogestion-secret-key-muy-largo-para-hmac-sha256-2024
app.jwt.expiration-ms=86400000

# Server
server.port=8080
