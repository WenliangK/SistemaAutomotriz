services:
  db:
    build: ./database
    environment:
      POSTGRES_DB: autogestion
      POSTGRES_USER: autogestion
      POSTGRES_PASSWORD: autogestion2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autogestion -d autogestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/autogestion
      SPRING_DATASOURCE_USERNAME: autogestion
      SPRING_DATASOURCE_PASSWORD: autogestion2024
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  pgdata:
