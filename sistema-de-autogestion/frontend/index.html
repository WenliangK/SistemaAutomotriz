<!DOCTYPE html>
<html lang="es" class="login-page">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestion - Iniciar Sesion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a1e33; }
        .ag-login-card { animation: fadeUp 0.4s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="ag-login" style="height:100vh; overflow:hidden;">
        <div class="ag-login-card">
            <div class="ag-login-header">
                <div class="ag-login-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                </div>
                <h1>AutoGestion</h1>
                <p>Sistema de gestion para talleres mecanicos</p>
            </div>
            <div class="ag-login-body">
                <div id="alertContainer" style="min-height:0; margin:0;"></div>
                <form id="loginForm" onsubmit="return false;">
                    <div class="ag-form-group">
                        <label class="ag-form-label" for="email">Correo electronico</label>
                        <input type="email" class="ag-form-control" id="email" placeholder="usuario@sanmartin.pe" required autocomplete="email">
                    </div>
                    <div class="ag-form-group">
                        <label class="ag-form-label" for="password">Contrasena</label>
                        <input type="password" class="ag-form-control" id="password" placeholder="Ingrese su contrasena" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="ag-btn ag-btn-primary ag-btn-block ag-btn-lg" style="margin-top: 0.5rem;">
                        Iniciar Sesion
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </form>
            </div>
            <div class="ag-login-footer">
                <p>Credenciales de prueba: admin@sanmartin.pe / admin123</p>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        if (isLoggedIn()) window.location.href = 'pages/dashboard.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) { showError('alertContainer', 'Complete todos los campos'); return; }
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!response.ok) { showError('alertContainer', 'Credenciales invalidas. Verifique su email y contrasena.'); return; }
                const data = await response.json();
                setToken(data.token);
                setUser({ id: data.id, nombre: data.nombre, email: data.email, rol: data.rol });
                window.location.href = 'pages/dashboard.html';
            } catch (error) {
                showError('alertContainer', 'Error de conexion. Verifique que el servidor este activo.');
            }
        });
    </script>
</body>
</html>
